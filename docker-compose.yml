name: guanlan

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guanlan
      POSTGRES_PASSWORD: guanlan
      POSTGRES_DB: guanlan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guanlan -d guanlan"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://guanlan:guanlan@postgres:5432/guanlan
      REDIS_URL: redis://redis:6379/0
      QUOTE_SOURCE: tencent
      DEMO_AUTO_PULSE: "false"
      SCAN_INTERVAL_SECONDS: "4"
      OFFHOURS_SCAN_INTERVAL_SECONDS: "60"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "18080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  web:
    build: ./web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "43123:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
